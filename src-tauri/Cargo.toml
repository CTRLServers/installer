[package]
name = "ctrlservers-installer"
version = "0.1.0"
description = "Installer for CTRLServers"
authors = ["We Are CTRLServers"]
edition = "2024"

[lib]
name = "ctrlservers_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "stream",
  "json",
  "rustls-tls",
  "http2",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "rt", "time"] }
dirs = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
